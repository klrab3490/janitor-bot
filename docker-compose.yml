services:
  janitor:
    build: .
    env_file: .env
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - janitor-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # Local Postgres for users who set DB_DRIVER=postgres in .env.
  # DATABASE_URL should then be: postgres://janitor:janitor@postgres:5432/janitor
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: janitor
      POSTGRES_PASSWORD: janitor
      POSTGRES_DB: janitor
    volumes:
      - janitor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janitor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  janitor-data:
  janitor-postgres:
