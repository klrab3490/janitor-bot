name: Bug report
description: Report something that isn't working as expected
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `/connect`
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Janitor version
      placeholder: e.g. 1.2.0 or commit SHA
    validations:
      required: true

  - type: dropdown
    id: db-driver
    attributes:
      label: Database driver
      options:
        - sqlite
        - postgres
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Please redact any secrets (tokens, API keys, webhook URLs).
      render: shell
